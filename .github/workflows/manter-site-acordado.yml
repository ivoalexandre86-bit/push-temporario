# Mantém o site do Render acordado. O plano grátis do projetos-web dorme
# depois de 15 min sem acesso e leva ~50 s para acordar; um acesso a cada
# 10 min evita isso. O GitHub pode atrasar ou pular execuções agendadas em
# horários de pico, e desativa o agendamento após 60 dias sem commits no
# repositório (reative em Actions > Manter site acordado > Enable workflow).
name: Manter site acordado

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acessar /api/health
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 https://projetos-web-mg82.onrender.com/api/health

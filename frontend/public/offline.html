<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d4ed8" />
    <title>Sem conexão - Gestão de Projetos</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; color: #1a2233; }
      main { max-width: 360px; padding: 24px; text-align: center; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 1.25rem; margin: 16px 0 8px; }
      p { color: #5b6472; line-height: 1.5; margin: 0 0 20px; }
      button { background: #1d4ed8; color: #fff; border: 0; border-radius: 8px; padding: 10px 20px; font-size: 1rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Você está sem conexão</h1>
      <p>O Sistema de Gestão de Projetos precisa de internet para carregar e salvar os dados. Verifique a conexão e tente novamente.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
